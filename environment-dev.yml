name: PGSN-dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Keep the runtime ranges in step with pyproject.toml
  - attrs>=25.3
  - cattrs>=25.1
  - treelib>=1.7
  - click>=8.2
  - graphviz
  - python-graphviz
  # What the tests need, as in the dev extra of pyproject.toml
  - pytest
  - typeguard>=4.4
  # libxml2 supplies xmllint, which tests/test_schema.py validates the
  # examples against PGSN.rng with. The test skips when it is absent, so a
  # missing validator is silence rather than a failure -- which is the reason
  # to declare it here.
  - libxml2
