# ビルドシステム自体の設定
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# パッケージの基本的な情報（メタデータ）
[project]
name = "pgsn"
version = "0.0.4"
authors = [
  { name="Yoriyuki Yamagata", email="yoriyuki@u-fukui.ac.jp" },
]
description = "PGSN: a programming language for GSN generation and manipulation"
readme = "README.md"
# 3.10 is the true floor: pgsn_term.cast uses a match statement, and
# annotations such as `str | Path` are evaluated at runtime. 3.10 reaches
# end of life in October 2026, so 3.11 is declared instead.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# このパッケージが依存する他のライブラリがあればここに書く
# Ranges belong here, exact pins in requirements.txt. A pin in this table
# constrains the user's whole environment, not just PGSN's own copy, and it
# says nothing about transitive dependencies. See #10 for the per-release
# hash-pinned constraints file and SBOM that record what a release was
# actually verified against.
dependencies = [
    "attrs>=25.3",
    "cattrs>=25.1",
    "treelib>=1.7",
    "graphviz>=0.21",
    "click>=8.2"
]

[project.urls]
Homepage = "https://github.com/yamagata-lab/pgsn"
Repository = "https://github.com/yamagata-lab/pgsn"

## ここが、コマンドラインツールを定義する場所
#[project.scripts]
## "コマンド名" = "パッケージ名.モジュール名:関数名"
#your-command = "your_package_name.main:cli"

[project.scripts]
pgsn = "pgsn.cli:cli"

# setuptoolsに、どこにパッケージのコードがあるか教える
[tool.setuptools.packages.find]
where = ["src"]